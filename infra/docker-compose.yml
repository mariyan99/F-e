# Local development infrastructure for Fabrizia.
# Not a production topology — see docs/plan/05-architecture-decision.md.
#
#   docker compose -f infra/docker-compose.yml up -d
#
# Images are pinned by tag here for readability. Production pins by digest.

name: fabrizia

services:
  postgres:
    image: postgres:16.10-alpine
    container_name: fabrizia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fabrizia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fabrizia_dev_only}
      # Medusa's database. The CMS database is created by init/01-create-databases.sh.
      POSTGRES_DB: ${POSTGRES_DB:-fabrizia_commerce}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabrizia} -d ${POSTGRES_DB:-fabrizia_commerce}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Valkey is the BSD-licensed Redis 7.2 fork. Drop-in for Medusa's event bus,
  # workflow engine, caching and locking modules.
  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: fabrizia-valkey
    restart: unless-stopped
    command: ["valkey-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.24
    container_name: fabrizia-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-fabrizia_dev_master_key_change_me}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stands in for Cloudflare R2 locally. Same S3 API, so the storage adapter
  # config is identical apart from the endpoint.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: fabrizia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-fabrizia}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-fabrizia_dev_only}
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the media bucket, then exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: fabrizia-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-fabrizia} ${S3_SECRET_ACCESS_KEY:-fabrizia_dev_only} &&
      mc mb --ignore-existing local/${S3_BUCKET:-fabrizia-media} &&
      mc anonymous set download local/${S3_BUCKET:-fabrizia-media} &&
      echo 'bucket ready'
      "

volumes:
  postgres-data:
  valkey-data:
  meili-data:
  minio-data:
